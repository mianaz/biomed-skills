<script>
const search=document.querySelector('#icon-search');
search.addEventListener('input',()=>{let count=0;const query=search.value.trim().toLowerCase();document.querySelectorAll('.current-icon-card').forEach(card=>{card.hidden=!card.textContent.toLowerCase().includes(query);if(!card.hidden)count++;});document.querySelector('#icon-count').textContent=`显示 ${count} 个图标`;});
