<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img"><title>Autophagosome</title><desc>双层膜包围待转运货物，用两道独立膜轮廓区别于内体和溶酶体。</desc><g id="generic-autophagosome-outer-membrane" data-part="outer-membrane" stroke="#434c5e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="80" cy="80" r="59" fill="#c3d5b4" /></g><g id="generic-autophagosome-intermembrane-space" data-part="intermembrane-space" stroke="#434c5e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="80" cy="80" r="51" fill="#f6f7fa" /></g><g id="generic-autophagosome-inner-membrane" data-part="inner-membrane" stroke="#434c5e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="80" cy="80" r="45" fill="#c3d5b4" /></g><g id="generic-autophagosome-lumen" data-part="lumen" stroke="#434c5e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="80" cy="80" r="38" fill="#f6f7fa" /></g><g id="generic-autophagosome-cargo" data-part="cargo" stroke="#434c5e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="52" y="68" width="56" height="24" rx="12" fill="#88c0d0" /></g></svg>
