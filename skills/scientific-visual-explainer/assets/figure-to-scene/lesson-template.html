<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Figure lesson</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:#243e44;font:16px/1.6 Arial,sans-serif}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:28px;margin:0 0 8px}p{margin:8px 0}.toolbar,.parts,.steps{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}button{font:inherit;padding:7px 12px;border:1px solid #a8bdb8;border-radius:5px;background:white;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#246963;color:white}button:focus-visible,input:focus-visible{outline:3px solid #bd8b61;outline-offset:3px}.views{display:grid;grid-template-columns:1fr 1fr;gap:18px}.view{background:white;border:1px solid #d7e1df;padding:14px;border-radius:7px;min-width:0}.drawing{overflow:auto}.drawing svg,.drawing img{display:block;width:100%;height:auto;min-width:640px}.caption{min-height:52px;font-size:18px}input[type=range]{flex:1;min-width:120px;accent-color:#246963}small{color:#596c70;font-size:14px}pre{white-space:pre-wrap}details{margin-top:24px}a{color:#246963}.selected{font-size:14px}.parts button{font-size:14px}label{display:flex;gap:8px;align-items:center}@media(max-width:1400px){.views{grid-template-columns:1fr}main{padding:16px}}@media print{.toolbar,.parts,.steps{display:none}.views{grid-template-columns:1fr}.drawing svg,.drawing img{min-width:0}}
</style></head><body><main>
<h1 id="title"></h1><p id="scope"></p>
<div class="toolbar"><button id="complete" aria-pressed="true">Complete figure</button><button id="play">Play explanation</button><button id="restart">Restart</button><label for="time">Time<input id="time" type="range" min="0" step="any" value="0"></label><output id="clock"></output></div>
<div class="views"><section class="view"><strong>Original figure</strong><div id="original" class="drawing"></div></section><section class="view"><strong id="mode">Component reconstruction</strong><div id="stage" class="drawing"></div></section></div>
<p id="caption" class="caption" aria-live="polite"></p><div id="steps" class="steps"></div><div id="parts" class="parts" aria-label="Select a component"></div><p id="detail" class="selected"></p>
<div class="toolbar"><button id="scene-download">Download scene JSON</button><button id="svg-download">Download current SVG</button></div>
<details><summary>Source and scope</summary><p id="timing"></p><pre id="sources"></pre><pre id="relations"></pre><p id="extraction"></p></details>
</main><script>/*SCENE_DATA*/</script><script>/*SCENE_ENGINE*/</script><script>
const $=s=>document.querySelector(s),engine=FigureScene.make(SCENE);let time=0,complete=true,selected='',playing=false,last=0;
document.title=SCENE.title;$('#title').textContent=SCENE.title;$('#scope').textContent=SCENE.scope;
$('#time').max=engine.duration;$('#timing').textContent='Timing basis: '+SCENE.timing_basis;
$('#sources').textContent=JSON.stringify(SCENE.sources,null,2);$('#relations').textContent=JSON.stringify(SCENE.relations,null,2);
$('#extraction').textContent='Import: '+SCENE.source.mode+'. Object identity and events follow the supplied annotation. Raster crop/mask parts retain image-level editability.';
if(SCENE.source.svg)$('#original').innerHTML=SCENE.source.svg;else{const img=document.createElement('img');img.src=SCENE.source.href;img.alt='Original figure';$('#original').append(img)}
function renderAt(t){time=t;const f=engine.frame(t);if(complete)for(const p of Object.values(f.poses))Object.assign(p,{dx:0,dy:0,opacity:1,fill:null,highlight:false});$('#stage').innerHTML=FigureScene.svg(SCENE,f,selected);$('#time').value=t;$('#clock').textContent=t.toFixed(1)+' / '+engine.duration.toFixed(1)+' s';$('#caption').textContent=complete?'Compare the reconstruction with the original, then play the explanation.':f.caption;$('#mode').textContent=complete?'Component reconstruction':'Explanation';$('#complete').setAttribute('aria-pressed',complete);document.querySelectorAll('[data-part]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.part===selected));return f}
function stop(){playing=false;$('#play').textContent='Play explanation'}
$('#complete').onclick=()=>{stop();complete=true;renderAt(time)};$('#restart').onclick=()=>{stop();complete=false;renderAt(0)};
$('#time').oninput=()=>{stop();complete=false;renderAt(+$('#time').value)};
function tick(now){if(!playing)return;const next=Math.min(engine.duration,time+(now-last)/1000);last=now;renderAt(next);if(next>=engine.duration)stop();else requestAnimationFrame(tick)}
$('#play').onclick=()=>{if(playing)return stop();if(complete||time>=engine.duration)time=0;complete=false;if(matchMedia('(prefers-reduced-motion: reduce)').matches){renderAt(engine.keyframes.find(t=>t>time)??engine.duration);return}playing=true;last=performance.now();$('#play').textContent='Pause';requestAnimationFrame(tick)};
for(const e of engine.events){const b=document.createElement('button');b.textContent=e.title||e.id;b.onclick=()=>{stop();complete=false;renderAt(e.end)};$('#steps').append(b)}
for(const e of SCENE.entities){const b=document.createElement('button');b.dataset.part=e.id;b.textContent=e.label;b.setAttribute('aria-pressed','false');b.onclick=()=>{selected=e.id;$('#detail').textContent=`${e.id} · ${e.kind} · ${e.asset_mode}`;renderAt(time)};$('#parts').append(b)}
function download(data,type,name){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#scene-download').onclick=()=>download(JSON.stringify(SCENE,null,2),'application/json','figure-scene.json');$('#svg-download').onclick=()=>download($('#stage').innerHTML,'image/svg+xml','figure-frame.svg');renderAt(0);
</script></body></html>
