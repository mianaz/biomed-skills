<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Publication template candidates</title>
<style>
body { font:16px/1.6 Arial,sans-serif; background:#f4f6f7; color:#24303a; margin:0 }
main { max-width:1100px; margin:auto; padding:28px }
article { background:white; padding:22px; margin:20px 0; border:1px solid #d6dfe4; border-radius:8px }
h1 { font-size:28px } h2 { font-size:20px }
.images { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:20px }
figure { margin:0 } img { max-width:100%; max-height:420px; object-fit:contain }
pre { white-space:pre-wrap; font-size:13px } a { color:#246478 }
@media(max-width:600px) { .images { grid-template-columns:1fr } }
</style>
<main>
<h1>Publication template candidates</h1>
<p>{{task}}</p>
<p>{{route}}</p>
<p>Ranked by compatibility and keyword overlap. Compare the images and input contracts before choosing.</p>
{{cards}}
</main>
</html>
